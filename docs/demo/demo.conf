# The demo tmux server for the README images (tmux -L ai-usage-demo).
# start.sh loads it with -f, so ~/.tmux.conf is never read.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g status-interval 1
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left ' demo '
set -g status-left-style 'fg=#89b4fa'
set -g status-right-length 200
set -g status-right '#{ai_usage} '
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
# Scaled down so the full step fits a terminal that stays readable on GitHub.
# The defaults are 180 140 110 80.
set -g @ai_usage_step_widths '100 84 68 52'
