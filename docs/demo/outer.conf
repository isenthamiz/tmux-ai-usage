# The outer tmux server (tmux -L ai-usage-outer). It only holds the demo client
# in a pane, so the steps GIF can narrow the demo with resize-pane. No status
# line, invisible borders, and no prefix: every key goes to the demo client.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g status off
set -g prefix None
unbind C-b
set -g pane-border-style 'fg=#1e1e2e,bg=#1e1e2e'
set -g pane-active-border-style 'fg=#1e1e2e,bg=#1e1e2e'
