# PROTOTYPE demo tmux config (tmux -L demo). Never loaded by the user's tmux.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g status-interval 1
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left ' demo '
set -g status-left-style 'fg=#89b4fa'
set -g status-right-length 200
set -g status-right '#{ai_usage} '
set -g @ai_usage_step_widths '100 84 68 52'   # demo only: scaled so the full step fits a readable width
